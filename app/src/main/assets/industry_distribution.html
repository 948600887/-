<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业占比</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // 初始化图表
        const chart = echarts.init(document.getElementById('chart-container'));
        
        // 模拟行业占比数据
        const generateIndustryData = () => {
            return [
                { name: '科技', value: 45 },
                { name: '金融', value: 20 },
                { name: '消费', value: 15 },
                { name: '医疗', value: 10 },
                { name: '能源', value: 5 },
                { name: '其他', value: 5 }
            ];
        };
        
        // 配置项
        const option = {
            title: {
                text: '行业占比',
                left: 'center'
            },
            tooltip: {
                trigger: 'item',
                formatter: '{a} <br/>{b}: {c}%'
            },
            legend: {
                orient: 'vertical',
                left: 'left',
                data: []
            },
            series: [
                {
                    name: '行业',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: {
                        show: false,
                        position: 'center'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 20,
                            fontWeight: 'bold'
                        }
                    },
                    labelLine: {
                        show: false
                    },
                    data: []
                }
            ]
        };
        
        // 填充数据
        const industryData = generateIndustryData();
        const legendData = industryData.map(item => item.name);
        
        option.legend.data = legendData;
        option.series[0].data = industryData;
        
        // 设置配置项
        chart.setOption(option);
        
        // 响应式
        window.addEventListener('resize', () => {
            chart.resize();
        });
        
        // 接收来自Android的数据
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'updateData') {
                updateIndustryData(data.data);
            }
        });
        
        // 更新行业数据
        function updateIndustryData(newData) {
            const legendData = newData.map(item => item.name);
            
            option.legend.data = legendData;
            option.series[0].data = newData;
            
            chart.setOption(option);
        }
    </script>
</body>
</html>
