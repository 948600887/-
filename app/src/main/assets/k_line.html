<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票K线图</title>
    <script src="file:///android_asset/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // 初始化图表
        const chart = echarts.init(document.getElementById('chart-container'));
        
        // 模拟K线数据
        const generateKLineData = () => {
            const data = [];
            const basePrice = 100;
            
            for (let i = 30; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                
                const open = basePrice + Math.random() * 10 - 5;
                const close = open + Math.random() * 10 - 5;
                const high = Math.max(open, close) + Math.random() * 3;
                const low = Math.min(open, close) - Math.random() * 3;
                const volume = Math.random() * 10000 + 5000;
                
                data.push([dateStr, open.toFixed(2), close.toFixed(2), low.toFixed(2), high.toFixed(2), volume.toFixed(0)]);
            }
            
            return data;
        };
        
        // 配置项
        const option = {
            title: {
                text: '股票K线图',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross'
                },
                renderMode: 'html',
                formatter: function(params) {
                    // 解析K线数据（格式：[开盘价, 收盘价, 最低价, 最高价]）
                    const data = params[0].data;
                    const date = params[0].name;
                    const change = ((data[2] - data[1]) / data[1] * 100).toFixed(3);

                    // 动态生成HTML内容
                    return `
                      <div style="font-size:14px;font-weight:bold">
                        ${date}
                      </div>
                      <div style="margin:5px 0">
                        <span style="color:${data[2] > data[1] ? '#ef232a' : '#14b143'}">
                          ${data[2] > data[1] ? '↑ 涨' : '↓ 跌'} ${Math.abs(change)}%
                        </span>
                      </div>
                      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                        <div>开盘价: <b>${data[1].toFixed(3)}</b></div>
                        <div>收盘价: <b>${data[2].toFixed(3)}</b></div>
                        <div>最低价: <b>${data[3].toFixed(3)}</b></div>
                        <div>最高价: <b>${data[4].toFixed(3)}</b></div>
                      </div>
                      <div style="margin-top:10px;padding:8px;background:#f0f8ff;border-radius:4px">
                        <span style="color:#666">价格区间: ${data[3].toFixed(3)} - ${data[4].toFixed(3)}</span>
                      </div>
                    `;
                  }
            },
            legend: {
                data: ['K线', 'MA5', 'MA10', 'MA20'],
                bottom: 10
            },
            grid: {
                left: '0%',
                right: '0%',
                top: '15%',
                bottom: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: [],
                boundaryGap: false,
                axisLine: {
                    lineStyle: {
                        color: '#8392A5'
                    }
                }
            },
            yAxis: [
                {
                    type: 'value',
                    scale: true,
                    position: 'right',
                    axisLine: {
                        lineStyle: {
                            color: '#8392A5'
                        }
                    },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#EAECEF'
                        }
                    }
                },
                {
                    type: 'value',
                    scale: true,
                    position: 'left',
                    axisLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    splitLine: {
                        show: false
                    }
                }
            ],
            dataZoom: [
                {
                    type: 'inside',
                    start: 50,
                    end: 100
                },
                {
                    show: true,
                    type: 'slider',
                    bottom: 5,
                    start: 50,
                    end: 100
                }
            ],
            series: [
                {
                    name: 'K线',
                    type: 'candlestick',
                    data: [],
                    itemStyle: {
                        color: '#ef4136',
                        color0: '#4caf50',
                        borderColor: '#ef4136',
                        borderColor0: '#4caf50'
                    }
                },
                {
                    name: 'MA5',
                    type: 'line',
                    data: [],
                    smooth: true,
                    showSymbol: false,
                    lineStyle: {
                        width: 1,
                        color: '#91cc75'
                    }
                },
                {
                    name: 'MA10',
                    type: 'line',
                    data: [],
                    smooth: true,
                    showSymbol: false,
                    lineStyle: {
                        width: 1,
                        color: '#fac858'
                    }
                },
                {
                    name: 'MA20',
                    type: 'line',
                    data: [],
                    smooth: true,
                    showSymbol: false,
                    lineStyle: {
                        width: 1,
                        color: '#ee6666'
                    }
                }
            ]
        };
        
        // 计算MA均线
        const calculateMA = (data, dayCount) => {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < dayCount - 1) {
                    result.push('-');
                    continue;
                }
                let sum = 0;
                for (let j = 0; j < dayCount; j++) {
                    sum += parseFloat(data[i - j][2]);
                }
                result.push((sum / dayCount).toFixed(2));
            }
            return result;
        };
        
        // 填充数据
        const kLineData = generateKLineData();
        const dates = kLineData.map(item => item[0]);
        const prices = kLineData.map(item => [parseFloat(item[1]), parseFloat(item[2]), parseFloat(item[3]), parseFloat(item[4])]);
        
        option.xAxis.data = dates;
        option.series[0].data = prices;
        option.series[1].data = calculateMA(kLineData, 5);
        option.series[2].data = calculateMA(kLineData, 10);
        option.series[3].data = calculateMA(kLineData, 20);
        
        // 设置配置项
        chart.setOption(option);
        
        // 响应式
        window.addEventListener('resize', () => {
            chart.resize();
        });
        
        // 接收来自Android的数据
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'updateKLineData') {
                updateKLineData(data.data);
            }
        });
        
        // 更新K线数据
        function updateKLineData(newData) {
            const dates = newData.map(item => item[0]);
            const prices = newData.map(item => [parseFloat(item[1]), parseFloat(item[2]), parseFloat(item[3]), parseFloat(item[4])]);
            
            option.xAxis.data = dates;
            option.series[0].data = prices;
            option.series[1].data = calculateMA(newData, 5);
            option.series[2].data = calculateMA(newData, 10);
            option.series[3].data = calculateMA(newData, 20);
            
            chart.setOption(option);
        }
    </script>
</body>
</html>
