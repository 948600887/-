<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收益趋势</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // 初始化图表
        const chart = echarts.init(document.getElementById('chart-container'));
        
        // 模拟收益趋势数据
        const generateTrendData = () => {
            const dates = [];
            const profitData = [];
            const valueData = [];
            
            let baseValue = 100000;
            let baseProfit = 0;
            
            for (let i = 30; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                dates.push(dateStr);
                
                // 模拟资产价值
                const valueChange = (Math.random() * 10000 - 5000);
                baseValue += valueChange;
                valueData.push(baseValue.toFixed(2));
                
                // 模拟收益
                baseProfit = baseValue - 100000;
                profitData.push(baseProfit.toFixed(2));
            }
            
            return { dates, profitData, valueData };
        };
        
        // 配置项
        const option = {
            title: {
                text: '收益趋势',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['总资产', '累计收益'],
                bottom: 10
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '15%',
                top: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: []
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '总资产',
                    type: 'line',
                    data: [],
                    smooth: true,
                    lineStyle: {
                        width: 2,
                        color: '#4caf50'
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0, color: 'rgba(76, 175, 80, 0.5)'
                            }, {
                                offset: 1, color: 'rgba(76, 175, 80, 0.1)'
                            }]
                        }
                    }
                },
                {
                    name: '累计收益',
                    type: 'line',
                    data: [],
                    smooth: true,
                    lineStyle: {
                        width: 2,
                        color: '#2196f3'
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0, color: 'rgba(33, 150, 243, 0.5)'
                            }, {
                                offset: 1, color: 'rgba(33, 150, 243, 0.1)'
                            }]
                        }
                    }
                }
            ]
        };
        
        // 填充数据
        const trendData = generateTrendData();
        option.xAxis.data = trendData.dates;
        option.series[0].data = trendData.valueData;
        option.series[1].data = trendData.profitData;
        
        // 设置配置项
        chart.setOption(option);
        
        // 响应式
        window.addEventListener('resize', () => {
            chart.resize();
        });
        
        // 接收来自Android的数据
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'updateData') {
                updateTrendData(data.data);
            }
        });
        
        // 更新趋势数据
        function updateTrendData(newData) {
            option.xAxis.data = newData.dates;
            option.series[0].data = newData.valueData;
            option.series[1].data = newData.profitData;
            
            chart.setOption(option);
        }
    </script>
</body>
</html>
